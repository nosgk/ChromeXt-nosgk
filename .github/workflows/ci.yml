name: ChromeXt CI

# Manual only. This workflow is never triggered by a push or a pull request.
on:
  workflow_dispatch:
    inputs:
      build_release:
        description: Build the release APK
        type: boolean
        default: true
      sign_release:
        description: Sign the release APK (requires the release environment)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chromext-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: false

      - name: Format, lint, unit tests and debug build
        run: ./gradlew --no-daemon ktfmtCheck lintDebug testDebugUnitTest assembleDebug

      - name: JavaScript asset tests
        run: |
          if [ -d tools/js-tests ]; then
            node --test tools/js-tests
          else
            echo "tools/js-tests is not present yet; skipping"
          fi

      - name: Documentation checks
        run: python3 tools/docs/check_docs.py

      - name: Generated browser catalog is current
        run: python3 tools/gen/browsers.py --check

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports
            app/build/test-results
          retention-days: 14
          if-no-files-found: ignore

  package:
    name: Package arm64-v8a APK
    needs: validate
    if: ${{ inputs.build_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: false

      - name: Build release
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify release APK
        run: bash scripts/verify-release.sh

      - name: Checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum ChromeXt-arm64-v8a-unsigned.apk > SHA256SUMS

      - name: Upload unsigned APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ChromeXt-arm64-v8a-unsigned-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/ChromeXt-arm64-v8a-unsigned.apk
            app/build/outputs/apk/release/SHA256SUMS
          retention-days: 14

  sign:
    name: Sign arm64-v8a APK
    needs: package
    if: ${{ inputs.build_release && inputs.sign_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    env:
      KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY }}
      KEYSTORE_ALIAS: ${{ secrets.ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download unsigned APK
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ChromeXt-arm64-v8a-unsigned-${{ github.run_number }}
          path: unsigned

      - name: Sign APK
        run: bash scripts/sign-apk.sh unsigned/ChromeXt-arm64-v8a-unsigned.apk app/build/outputs/apk/release/ChromeXt-arm64-v8a.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ChromeXt-arm64-v8a-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/ChromeXt-arm64-v8a.apk
            app/build/outputs/apk/release/SHA256SUMS
          retention-days: 30
