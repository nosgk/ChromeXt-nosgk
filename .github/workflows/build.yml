name: Build Android arm64-v8a APK

# Manual only. This workflow builds, verifies and signs the release APK.
# It intentionally has no separate CI/validation stage.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromext-build-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  build:
    name: Build and sign arm64-v8a APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    env:
      KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY }}
      KEYSTORE_ALIAS: ${{ secrets.ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: false

      - name: Validate (temporary)
        run: |
          ./gradlew --no-daemon ktfmtFormat testDebugUnitTest
          git diff --stat

      - name: Upload formatted sources (temporary)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formatted-sources-${{ github.run_number }}
          path: app/src
          retention-days: 3

      - name: Build release
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify release APK
        run: bash scripts/verify-release.sh

      - name: Sign APK
        run: |
          bash scripts/sign-apk.sh \
            app/build/outputs/apk/release/ChromeXt-arm64-v8a-unsigned.apk \
            app/build/outputs/apk/release/ChromeXt-arm64-v8a.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ChromeXt-arm64-v8a-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/ChromeXt-arm64-v8a.apk
            app/build/outputs/apk/release/SHA256SUMS
          retention-days: 30
