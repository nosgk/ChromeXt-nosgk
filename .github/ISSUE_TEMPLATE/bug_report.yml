name: Bug report
description: Report a reproducible problem with ChromeXt
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please include enough detail to reproduce the problem.
        Security issues must not be reported here; see SECURITY.md.
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "e.g. Chrome 141.0.7390.122"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and ROM
      placeholder: "e.g. Android 15, ColorOS 16"
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: Xposed framework
      placeholder: "e.g. LSPosed 1.9.x, Vector, LSPatch"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Xposed log or `adb logcat -s ChromeXt`
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: This is not a security vulnerability.
          required: true
